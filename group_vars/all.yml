git_user_name: "ArminIrannejad"
git_user_email: "armin.irannejad@gmail.com"

# uv needs to run before py; paru before any role that needs the AUR
default_roles:
  - system
  - paru
  - bat
  - btop
  - build_essentials
  - clang
  - cmake
  - curl
  - eza
  - fastfetch
  - fd
  - fzf
  - gh
  - git
  # - gitleaks
  - go
  - haskell
  - hyperfine
  - java
  - jq
  - lua
  - neovim
  - nodejs
  - podman
  - python
  - ripgrep
  - rust
  - starship
  - terraform
  - tmux
  - tree
  # - tuicr
  - unzip
  - sqlcl # after java and unzip
  - uv
  - python_dev
  - wget
  - windows # wsl only
  - zoxide
  - zsh

exclude_roles: []
exclude_roles_by_distribution: {}

system_update_packages: false
zsh_default_shell: true
neovim_enabled: true
starship_enabled: true

neovim_install_dir: /opt/nvim

haskell_ghc_version: "9.10.3"
haskell_cabal_version: "3.14.2.0"
haskell_stack_version: "3.7.1"
haskell_hls_version: "2.13.0.0"

rust_toolchain: stable
rust_components:
  - clippy
  - rust-analyzer
  - rustfmt

pi_install_claude_code: true
pi_packages:
  - npm:pi-web-access
  - npm:pi-mcp-adapter
  - npm:pi-subagents
  - npm:pi-simplify
  - npm:pi-x-ide
  - npm:pi-mermaid
  - npm:pi-claude-bridge
  - git:github.com/tmustier/pi-nes
pi_settings:
  "$schema": https://pi.dev/schemas/settings.schema.json
  theme: dark/dark
  defaultThinkingLevel: xhigh
  quietStartup: true
  collapseChangelog: true
  retry:
    enabled: true
    maxRetries: 10
  editorPaddingX: 1
  enabledModels:
    - claude-fable-*
    - claude-opus-*
    - claude-sonnet-*
    - gpt-5*
  extensions:
    - "-builtin:mcp"
  defaultProjectTrust: always
  defaultProvider: anthropic
  defaultModel: claude-opus-4-8

config_dir: "{{ ansible_facts['env']['HOME'] }}/.config"
bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
sqlcl_dir: "{{ ansible_facts['env']['HOME'] }}/.local/share/sqlcl"
