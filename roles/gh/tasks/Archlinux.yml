---
- name: "Gh | {{ ansible_facts['distribution'] }} | Install packages"
  community.general.pacman:
    name: github-cli
    state: present
  become: true
  when: can_install_packages | default(false)

- name: "Gh | {{ ansible_facts['distribution'] }} | Package installation skipped"
  ansible.builtin.debug:
    msg: "GitHub CLI installation skipped because sudo is unavailable."
  when: not (can_install_packages | default(false))
