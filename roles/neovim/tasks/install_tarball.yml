---
# Neovim is installed from the upstream stable tarball rather than distro
# packages: the Ubuntu archive lags badly, neovim-ppa/unstable tracks nightly,
# and Fedora's dnf package trails stable by a point release or two.

- name: "Neovim | Define release asset"
  ansible.builtin.set_fact:
    neovim_asset: "nvim-linux-{{ 'arm64' if ansible_facts['machine'] == 'aarch64' else 'x86_64' }}"

- name: "Neovim | Getting version information"
  ansible.builtin.command: "{{ neovim_install_dir }}/bin/nvim --version"
  register: neovim_installed
  changed_when: false
  failed_when: false

# /releases/latest never resolves to a prerelease, so this tracks stable only.
- name: "Neovim | Querying latest stable release"
  ansible.builtin.uri:
    url: https://api.github.com/repos/neovim/neovim/releases/latest
    headers:
      Accept: application/vnd.github+json
  register: neovim_release
  changed_when: false

- name: "Neovim | Register versions"
  ansible.builtin.set_fact:
    neovim_latest_version: "{{ neovim_release.json.tag_name }}"
    neovim_current_version: "{{ neovim_installed.stdout | default('') | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+') | default('none', true) }}"

- name: "Neovim | Install"
  when:
    - can_install_packages | default(false)
    - neovim_current_version != neovim_latest_version
  block:
    - name: "Neovim | Downloading {{ neovim_latest_version }}"
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ neovim_latest_version }}/{{ neovim_asset }}.tar.gz"
        dest: "/tmp/{{ neovim_asset }}.tar.gz"
        mode: "0644"
        force: true

    - name: "Neovim | Remove any current Neovim installation"
      ansible.builtin.file:
        path: "{{ neovim_install_dir }}"
        state: absent
      become: true

    - name: "Neovim | Create install directory"
      ansible.builtin.file:
        path: "{{ neovim_install_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: "Neovim | Extract tarball"
      ansible.builtin.unarchive:
        src: "/tmp/{{ neovim_asset }}.tar.gz"
        dest: "{{ neovim_install_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
      become: true

    - name: "Neovim | Link nvim onto PATH"
      ansible.builtin.file:
        src: "{{ neovim_install_dir }}/bin/nvim"
        dest: /usr/local/bin/nvim
        state: link
        force: true
      become: true

    - name: "Neovim | Report version change"
      ansible.builtin.debug:
        msg: "Neovim updated: {{ neovim_current_version }} -> {{ neovim_latest_version }}"

  always:
    - name: "Neovim | Cleanup downloaded tarball"
      ansible.builtin.file:
        path: "/tmp/{{ neovim_asset }}.tar.gz"
        state: absent

- name: "Neovim | Package installation skipped"
  ansible.builtin.debug:
    msg: "Neovim installation skipped because sudo is unavailable."
  when: not (can_install_packages | default(false))
