---
- name: "Starship | {{ ansible_facts['distribution'] }} | Try system package"
  community.general.pacman:
    name: starship
    state: present
  become: true
  register: starship_system_install
  # ignore_errors, not failed_when: false, so `failed` survives on the result and
  # the script fallback can tell whether the package actually installed.
  ignore_errors: true
  when:
    - starship_installed.rc != 0 or starship_package_managed | bool
    - can_install_packages | default(false)

- name: "Starship | {{ ansible_facts['distribution'] }} | Install Starship using official script"
  ansible.builtin.shell:
    cmd: curl -fsSL https://starship.rs/install.sh | sh -s -- --force
  become: true
  when:
    - can_install_packages | default(false)
    - (starship_installed.rc != 0 and starship_system_install.failed | default(true)) or
      (starship_script_outdated | bool and starship_path.stdout == '/usr/local/bin/starship')

- name: "Starship | {{ ansible_facts['distribution'] }} | Install Starship to user bin"
  ansible.builtin.shell:
    cmd: curl -fsSL https://starship.rs/install.sh | sh -s -- --bin-dir "{{ bin_dir }}" --force
  when: >-
    (starship_installed.rc != 0 and not (can_install_packages | default(false))) or
    (starship_script_outdated | bool and starship_path.stdout == bin_dir ~ '/starship')
