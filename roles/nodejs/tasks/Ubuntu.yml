---
# Ubuntu 24.04 ships Node.js 18, while Pi requires Node.js 22.19 or newer.
- name: "Nodejs | {{ ansible_facts['distribution'] }} | Create keyring directory"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: can_install_packages | default(false)

- name: "Nodejs | {{ ansible_facts['distribution'] }} | Install NodeSource key"
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"
  become: true
  when: can_install_packages | default(false)

- name: "Nodejs | {{ ansible_facts['distribution'] }} | Configure NodeSource repository"
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_22.x nodistro main
    filename: nodesource
    state: present
  become: true
  when: can_install_packages | default(false)

- name: "Nodejs | {{ ansible_facts['distribution'] }} | Install packages"
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
  become: true
  when: can_install_packages | default(false)

- name: "Nodejs | {{ ansible_facts['distribution'] }} | Package installation skipped"
  ansible.builtin.debug:
    msg: "Node.js installation skipped because sudo is unavailable. Pi needs Node.js 22.19 or newer."
  when: not (can_install_packages | default(false))
