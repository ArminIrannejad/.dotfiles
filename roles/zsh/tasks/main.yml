---
- name: "{{ role_name | capitalize }} | Checking for distribution config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: zsh_distribution_config

- name: "{{ role_name | capitalize }} | Run tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: zsh_distribution_config.stat.exists

# The login shell is set here rather than per-distro: chsh works the same on
# every platform, and zsh may live in /usr/bin, /usr/local/bin or Homebrew.
- name: "Zsh | Resolve zsh path"
  ansible.builtin.shell:
    cmd: command -v zsh
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: zsh_binary
  changed_when: false
  failed_when: false

- name: "Zsh | Register zsh in /etc/shells"
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ zsh_binary.stdout }}"
    state: present
    create: true
    mode: "0644"
  become: true
  when:
    - zsh_binary.rc == 0
    - can_install_packages | default(false)

- name: "Zsh | Set default shell"
  ansible.builtin.command:
    cmd: "chsh -s {{ zsh_binary.stdout }} {{ host_user }}"
  become: "{{ can_install_packages | default(false) }}"
  register: zsh_chsh
  changed_when: zsh_chsh.rc == 0
  failed_when: false
  when:
    - zsh_default_shell | default(true)
    - zsh_binary.rc == 0
    - ansible_facts['user_shell'] != zsh_binary.stdout

- name: "Zsh | Default shell change skipped"
  ansible.builtin.debug:
    msg: "Could not set zsh as the login shell. Run `chsh -s {{ zsh_binary.stdout | default('$(command -v zsh)') }}` manually."
  when:
    - zsh_chsh is defined
    - zsh_chsh is not skipped
    - zsh_chsh.rc | default(0) != 0

- name: "Zsh | Ensure config directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/zsh"
    - "{{ ansible_facts['user_dir'] }}/.config/zsh/plugins"
    - "{{ ansible_facts['user_dir'] }}/.cache/zsh"
    - "{{ ansible_facts['user_dir'] }}/.local/state/zsh"

- name: "Zsh | Link startup files"
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: .zshenv
      dest: "{{ ansible_facts['user_dir'] }}/.zshenv"
    - src: .zshenv
      dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/.zshenv"
    - src: .zshrc
      dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    - src: .zshrc
      dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/.zshrc"

- name: "Zsh | Link custom zsh config"
  ansible.builtin.file:
    src: "{{ role_path }}/files/zsh/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/{{ item }}"
    state: link
    force: true
  loop:
    - aliases.zsh
    - bindings.zsh
    - fzf.zsh
    - plugins.zsh
    - prompt.zsh

- name: "Zsh | Check for git"
  ansible.builtin.command: git --version
  register: zsh_git_check
  changed_when: false
  failed_when: false

- name: "Zsh | Install plugins"
  ansible.builtin.git:
    repo: "https://github.com/{{ item.repo }}.git"
    dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/plugins/{{ item.name }}"
    depth: 1
    update: false
  loop:
    - { repo: "zdharma-continuum/fast-syntax-highlighting", name: "fast-syntax-highlighting" }
    - { repo: "Aloxaf/fzf-tab", name: "fzf-tab" }
    - { repo: "zsh-users/zsh-autosuggestions", name: "zsh-autosuggestions" }
    - { repo: "zsh-users/zsh-history-substring-search", name: "zsh-history-substring-search" }
    - { repo: "jeffreytse/zsh-vi-mode", name: "zsh-vi-mode" }
  when: zsh_git_check.rc == 0
